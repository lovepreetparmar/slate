name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slate
          POSTGRES_PASSWORD: slate
          POSTGRES_DB: slate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://slate:slate@localhost:5432/slate?schema=public
      AUTH_SECRET: ci-test-secret
      AUTH_DEV_MODE: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run db:migrate

      - run: npm run typecheck

      - run: npm test

      - run: npm run lint

      - run: npm run build
